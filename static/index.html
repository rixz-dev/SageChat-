<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sagechat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root{
    --bg-start:#0A0B0A; --bg-end:#1D201D;
    --surface:#17191A; --surface-2:#212421; --surface-3:#282B28;
    --border:#2C2F2C;
    --accent:#8FC088; --accent-strong:#A3D19C; --accent-tint:#22331F;
    --text:#EDEDE9; --text-muted:#8B8E89;
    --danger:#D97E7E; --warn:#D9C07E;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Manrope', sans-serif;
    background:linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
    color:var(--text);
    height:100vh; height:100svh;
    display:flex; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  button{ font-family:inherit; }

  /* ---- Sidebar ---- */
  .sidebar{ width:264px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 14px; flex-shrink:0; z-index:30; }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 4px 22px 4px; }
  .logo-badge{ width:36px;height:36px; border-radius:50%; background:var(--accent);
    display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .logo-badge svg{ width:20px;height:20px; }
  .brand-name{ font-weight:800; font-size:17px; letter-spacing:-0.01em; }

  .new-chat{ display:flex;align-items:center;gap:8px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:12px; padding:11px 14px; font-size:14px; font-weight:600; font-family:inherit; color:var(--text);
    cursor:pointer; margin-bottom:20px; transition:border-color .15s ease, background .15s ease; min-height:44px; }
  .new-chat:hover{ border-color:var(--accent); background:var(--surface-3); }
  .new-chat:focus-visible, .send-btn:focus-visible, .tool-btn:focus-visible, textarea:focus-visible,
  .menu-btn:focus-visible, .plus-item-main:focus-visible, .plus-item-row:focus-visible, .icon-btn:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px; }

  .history-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
    color:var(--text-muted); padding:0 8px 10px 8px; }
  .history-scroll{ flex:1; overflow-y:auto; }
  .history-item{ padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:500; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; min-height:40px; display:flex; align-items:center;
    justify-content:space-between; gap:6px; }
  .history-item:hover{ background:var(--surface-2); }
  .history-item.active{ background:var(--accent-tint); color:var(--accent-strong); font-weight:600; }
  .history-item .del-hist{ opacity:0; background:none; border:none; color:var(--text-muted); cursor:pointer; padding:2px; flex-shrink:0; }
  .history-item:hover .del-hist{ opacity:1; }

  .overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; }
  .overlay.show{ display:block; }

  /* ---- Main chat area ---- */
  .chat{ flex:1; display:flex; min-width:0; min-height:0; }
  .chat-col{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .chat-header{ padding:14px 24px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .menu-btn{ display:none; width:38px;height:38px; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--border); border-radius:10px; color:var(--text); cursor:pointer; flex-shrink:0; }
  .header-title{ font-size:15px; font-weight:700; flex:1; }
  .icon-btn{ width:36px;height:36px; border-radius:10px; border:1px solid var(--border); background:transparent;
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; position:relative; }
  .icon-btn:hover{ border-color:var(--accent); background:var(--surface-2); }
  .icon-btn svg{ width:17px;height:17px; }
  .icon-btn.active-dot::after{ content:''; position:absolute; top:5px; right:5px; width:7px;height:7px; border-radius:50%; background:var(--accent-strong); }

  .stage{ flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0; }

  .landing{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; padding:32px 24px; text-align:center; }
  .landing[hidden]{ display:none; }
  .landing-logo{ width:64px;height:64px; }
  .landing-logo svg{ width:32px;height:32px; }
  .greeting{ font-family:'Fraunces', serif; font-weight:600; font-size:30px; line-height:1.3; margin:0; }
  .greeting em{ font-style:italic; font-weight:700; color:var(--accent-strong); }
  .input-slot{ width:100%; max-width:560px; }

  .messages{ flex:1; overflow-y:auto; padding:28px 24px; display:flex; flex-direction:column; gap:20px;
    max-width:760px; width:100%; margin:0 auto; }
  .messages[hidden]{ display:none; }
  .msg{ display:flex; flex-direction:column; gap:5px; max-width:88%; }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg.assistant{ align-self:flex-start; width:100%; }
  .bubble{ padding:12px 16px; border-radius:var(--radius); font-size:14.5px; line-height:1.6; font-weight:500;
    overflow-wrap:anywhere; word-break:break-word; max-width:100%; }
  .bubble p{ margin:0 0 8px 0; } .bubble p:last-child{ margin-bottom:0; }
  .bubble ul,.bubble ol{ margin:6px 0; padding-left:20px; }
  .msg.user .bubble{ background:var(--accent-tint); border:1px solid #33452F; border-bottom-right-radius:4px; }
  .msg.assistant .bubble{ background:var(--surface-2); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg .meta{ font-size:11px; font-weight:600; color:var(--text-muted); padding:0 4px; }
  .bubble img.att-img{ max-width:220px; border-radius:10px; display:block; margin-top:6px; }
  .attach-chip{ display:inline-flex; align-items:center; gap:5px; background:var(--surface-3); border:1px solid var(--border);
    border-radius:8px; padding:4px 8px; font-size:12px; margin-top:6px; }

  .code-block{ margin:8px 0; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
  .code-head{ display:flex; justify-content:space-between; align-items:center; background:#111311;
    padding:6px 10px; font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .code-head button{ background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:11px; font-weight:700; }
  .code-head button:hover{ color:var(--accent-strong); }
  .bubble pre{ margin:0; padding:12px; overflow-x:auto; font-size:13px; }

  .msg-actions{ display:flex; gap:4px; padding:2px 4px; }
  .msg-actions button{ background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px;
    border-radius:6px; display:flex; align-items:center; }
  .msg-actions button:hover{ background:var(--surface-2); color:var(--text); }
  .msg-actions svg{ width:14px;height:14px; }

  .thinking-indicator{ font-size:12.5px; color:var(--text-muted); font-style:italic; padding:0 4px; display:flex; align-items:center; gap:6px; }
  .dot-pulse{ width:5px;height:5px;border-radius:50%; background:var(--accent-strong); animation:pulse 1s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  /* ---- Tool-run card (dipakai di alur pesan, bukan raw JSON) ---- */
  .tool-card{ align-self:flex-start; width:100%; max-width:88%; border:1px solid var(--border); border-radius:14px;
    background:var(--surface-2); overflow:hidden; font-size:12.5px; }
  .tool-card-head{ display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; user-select:none; }
  .tool-card-head .tag{ font-weight:700; padding:2px 7px; border-radius:6px; font-size:10px; text-transform:uppercase; flex-shrink:0; }
  .tool-card-head .summary{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); font-weight:600; }
  .tool-card-head .toggle{ background:none;border:none;color:var(--text-muted);cursor:pointer; flex-shrink:0; display:flex;
    padding:2px; border-radius:6px; transition:transform .15s ease; }
  .tool-card-head .toggle.open{ transform:rotate(180deg); }
  .tool-card-head .toggle svg{ width:14px;height:14px; }
  .tool-card-body{ padding:8px 12px 12px 12px; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;
    color:var(--text-muted); font-family:monospace; font-size:11.5px; max-height:260px; overflow-y:auto; border-top:1px solid var(--border); }
  .tool-card-body[hidden]{ display:none; }

  .bottom-wrap{ max-width:760px; width:100%; margin:0 auto; flex-shrink:0; }
  .bottom-wrap:not(:empty){ padding:14px 24px calc(20px + env(safe-area-inset-bottom)) 24px; }

  .attach-preview{ display:flex; gap:6px; flex-wrap:wrap; padding:0 2px; }
  .attach-preview .chip{ display:flex; align-items:center; gap:6px; background:var(--surface-3); border:1px solid var(--border);
    border-radius:8px; padding:4px 8px; font-size:12px; }
  .attach-preview .chip button{ background:none; border:none; color:var(--text-muted); cursor:pointer; }

  .input-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:22px;
    padding:12px 14px 10px 14px; display:flex; flex-direction:column; gap:8px; position:relative; }
  .input-box textarea{ width:100%; border:none; background:transparent; resize:none; font-family:inherit;
    font-weight:500; font-size:14.5px; line-height:1.5; color:var(--text); max-height:140px; padding:2px; }
  .input-box textarea:focus{ outline:none; }
  .input-box textarea::placeholder{ color:var(--text-muted); }

  .input-toolbar{ display:flex; align-items:center; gap:8px; }
  .tool-btn{ width:34px;height:34px;border-radius:50%; border:1px solid var(--border); background:transparent;
    color:var(--text); display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0;
    transition:background .15s ease,border-color .15s ease; }
  .tool-btn svg{ width:17px;height:17px; }
  .tool-btn:hover{ background:var(--surface-3); border-color:var(--accent); }
  .model-btn{ width:auto; border-radius:16px; padding:0 12px; height:32px; font-size:12.5px; font-weight:700;
    font-family:inherit; gap:6px; max-width:180px; }
  .model-btn span.mname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px; }
  .model-btn svg{ width:13px;height:13px; flex-shrink:0; }
  .spacer{ flex:1; }
  .send-btn{ width:36px;height:36px; border-radius:50%; border:none; background:var(--accent); color:#0A0B0A;
    display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; transition:background .15s ease; }
  .send-btn:hover{ background:var(--accent-strong); }
  .send-btn.stopping{ background:var(--danger); }
  .send-btn svg{ width:16px;height:16px; }

  .plus-menu{ position:absolute; bottom:calc(100% + 10px); left:0; width:300px; max-width:82vw;
    background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:10px;
    box-shadow:0 12px 40px rgba(0,0,0,.5); z-index:40; max-height:70vh; overflow-y:auto; }
  .plus-menu[hidden]{ display:none; }
  .plus-menu-top{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-bottom:8px; }
  .plus-item-main{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px;
    background:var(--surface-3); border:1px solid var(--border); border-radius:12px; cursor:pointer;
    font-family:inherit; font-size:11.5px; font-weight:600; color:var(--text); min-height:64px; justify-content:center; }
  .plus-item-main:hover{ border-color:var(--accent); }
  .plus-item-main svg{ width:19px;height:19px; color:var(--accent-strong); }
  .plus-menu-list{ display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--border); padding-top:8px; }
  .plus-item-row{ display:flex; align-items:center; gap:10px; padding:9px 8px; border:none; background:transparent;
    border-radius:9px; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:500; color:var(--text); width:100%; text-align:left; }
  .plus-item-row:hover{ background:var(--surface-3); }
  .plus-item-row svg{ width:16px;height:16px; color:var(--text-muted); flex-shrink:0; }
  .plus-item-row .row-label{ flex:1; }
  .plus-item-row .chev{ width:14px;height:14px; color:var(--text-muted); }
  .toggle-pill{ width:34px; height:19px; border-radius:20px; background:var(--surface-3); border:1px solid var(--border); position:relative; flex-shrink:0; }
  .toggle-pill::after{ content:''; position:absolute; top:2px; left:2px; width:13px;height:13px; border-radius:50%; background:var(--text-muted); transition:.15s; }
  .toggle-pill.on{ background:var(--accent-tint); border-color:var(--accent); }
  .toggle-pill.on::after{ transform:translateX(15px); background:var(--accent-strong); }

  /* ---- Activity log drawer ---- */
  .log-drawer{ width:340px; border-left:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; flex-shrink:0; }
  .log-drawer[hidden]{ display:none; }
  .log-head{ padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .log-head strong{ font-size:13px; }
  .log-head button{ background:none;border:none;color:var(--text-muted);cursor:pointer; }
  .log-body{ flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:6px; }
  .log-entry{ border:1px solid var(--border); border-radius:10px; background:var(--surface-2); font-size:12px; overflow:hidden; }
  .log-entry-head{ display:flex; align-items:center; gap:6px; padding:8px 10px; cursor:pointer; }
  .log-entry-head .tag{ font-weight:700; padding:1px 6px; border-radius:5px; font-size:10px; text-transform:uppercase; }
  .tag.thinking{ background:#2b2f45; color:#a3b4d1; }
  .tag.run{ background:var(--accent-tint); color:var(--accent-strong); }
  .tag.github{ background:#3a2f1c; color:var(--warn); }
  .tag.permission{ background:#3a1c1c; color:var(--danger); }
  .tag.error{ background:#3a1c1c; color:var(--danger); }
  .tag.info{ background:var(--surface-3); color:var(--text-muted); }
  .log-entry-summary{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-muted); }
  .log-entry-body{ padding:0 10px 10px 10px; white-space:pre-wrap; word-break:break-word; color:var(--text); font-family:monospace; font-size:11px; max-height:220px; overflow-y:auto; }
  .log-entry-body[hidden]{ display:none; }
  .perm-actions{ display:flex; gap:6px; padding:0 10px 10px 10px; }
  .perm-actions button{ flex:1; padding:6px; border-radius:8px; border:1px solid var(--border); font-size:11.5px; font-weight:700; cursor:pointer; }
  .perm-allow{ background:var(--accent-tint); color:var(--accent-strong); }
  .perm-deny{ background:#3a1c1c; color:var(--danger); }

  /* ---- Modals ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-overlay[hidden]{ display:none; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:18px; width:100%; max-width:480px;
    max-height:85vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal.wide{ max-width:680px; }
  .modal-head{ padding:16px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .modal-head h3{ margin:0; font-size:15px; }
  .modal-head button{ background:none;border:none;color:var(--text-muted);cursor:pointer; }
  .modal-body{ padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:5px; }
  .field input, .field textarea, .field select{ width:100%; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:9px 10px; color:var(--text); font-family:inherit; font-size:13.5px; }
  .field textarea{ resize:vertical; min-height:70px; font-family:monospace; }
  .field-status{ margin:5px 2px 0 2px; font-size:11.5px; font-weight:700; }
  .field-status.set{ color:var(--accent-strong); }
  .field-status.unset{ color:var(--text-muted); font-weight:600; }
  .tree-item.selected{ border-color:var(--accent); background:var(--accent-tint); }
  .btn{ padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    font-weight:700; font-size:13px; cursor:pointer; }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accent); color:#0A0B0A; border-color:var(--accent); }
  .btn.primary:hover{ background:var(--accent-strong); }
  .btn.danger{ background:#3a1c1c; color:var(--danger); border-color:#5a2c2c; }
  .row-flex{ display:flex; gap:8px; }
  .row-flex > *{ flex:1; }
  .model-list, .tree-list, .memory-list{ display:flex; flex-direction:column; gap:4px; max-height:280px; overflow-y:auto; }
  .model-list button, .tree-item{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 10px;
    border-radius:9px; background:var(--surface-2); border:1px solid var(--border); cursor:pointer; font-size:13px; color:var(--text); text-align:left; }
  .model-list button:hover, .tree-item:hover{ border-color:var(--accent); }
  .model-list button.selected{ border-color:var(--accent); background:var(--accent-tint); }
  .badge{ font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; background:var(--surface-3); color:var(--text-muted); }
  .badge.vision{ background:var(--accent-tint); color:var(--accent-strong); }
  .breadcrumb{ font-size:12px; color:var(--text-muted); display:flex; gap:4px; flex-wrap:wrap; }
  .breadcrumb span{ cursor:pointer; text-decoration:underline; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .stat-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; }
  .stat-box .num{ font-size:18px; font-weight:800; }
  .stat-box .lbl{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; }
  .memory-item{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:13px; }
  .memory-item button{ background:none;border:none;color:var(--text-muted);cursor:pointer;flex-shrink:0; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--border);
    padding:10px 16px; border-radius:10px; font-size:13px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .toast.error{ border-color:#5a2c2c; color:var(--danger); }

  @media (max-width: 768px){
    .sidebar{ position:fixed; top:0; left:0; bottom:0; width:82%; max-width:300px;
      transform:translateX(-100%); transition:transform .25s ease; box-shadow:0 0 40px rgba(0,0,0,.5); z-index:50; }
    .sidebar.open{ transform:translateX(0); }
    .menu-btn{ display:flex; }
    .chat-header{ padding:12px 16px; }
    .landing{ padding:24px 16px; gap:18px; }
    .greeting{ font-size:24px; }
    .messages{ padding:20px 16px; gap:16px; }
    .msg{ max-width:94%; }
    .bottom-wrap:not(:empty){ padding:10px 16px calc(16px + env(safe-area-inset-bottom)) 16px; }
    .send-btn{ width:40px;height:40px; }
    .plus-menu{ position:fixed; left:0; right:0; bottom:0; width:100%; max-width:100%;
      border-radius:20px 20px 0 0; max-height:70vh; overflow-y:auto;
      padding-bottom:calc(14px + env(safe-area-inset-bottom)); }
    .log-drawer{ position:fixed; top:0; right:0; bottom:0; width:86%; max-width:340px; z-index:50; }
  }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo-badge">
      <svg viewBox="0 0 100 100" fill="none">
        <g stroke="#0A0B0A" stroke-width="7" stroke-linecap="round">
          <path d="M50,50 C50,32 62,20 78,22 C90,23.5 96,34 92,44 C88.5,52.5 78,55 71,50" transform="rotate(0 50 50)"/>
          <path d="M50,50 C50,32 62,20 78,22 C90,23.5 96,34 92,44 C88.5,52.5 78,55 71,50" transform="rotate(120 50 50)"/>

<script>
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

marked.setOptions({ breaks: true });

// ---------------- Global state ----------------
let state = {
  sessionId: null,
  sessions: [],
  config: null,
  models: [],
  currentTurnId: null,
  streaming: false,
  attachments: [], // {id, filename, is_image, url}
  ghCurrentPath: "",
};

function toast(msg, isError=false){
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 3500);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- Tool-block parsing (<<CMD>>...<<END>> / <<GH>>...<<END>>) ----------------
// Blok tool call dari AI TIDAK BOLEH tampil sebagai teks mentah di bubble chat — itu yang bikin
// balasan AI kelihatan "aneh" dan bikin kotak jadi melebar/off-side. Blok ini dipisah dan
// ditampilkan lewat tool-card (lihat renderToolCard) yang punya elemen buka/tutup sendiri.
const TOOL_BLOCK_RE = /<<(?:CMD|GH)>>\s*\{[\s\S]*?\}\s*<<END>>/g;
const TOOL_OPEN_RE = /<<(?:CMD|GH)>>/;

function stripToolBlocksForDisplay(text){
  let out = (text || '').replace(TOOL_BLOCK_RE, '').trim();
  const openMatch = out.match(TOOL_OPEN_RE);
  if(openMatch) out = out.slice(0, openMatch.index).trim();
  return out;
}

function detectRunningToolKind(text){
  const lastCmd = text.lastIndexOf('<<CMD>>');
  const lastGh = text.lastIndexOf('<<GH>>');
  const lastEnd = text.lastIndexOf('<<END>>');
  if(lastCmd > lastEnd && lastCmd >= lastGh) return 'shell';
  if(lastGh > lastEnd) return 'github';
  return null;
}

async function api(path, opts={}){
  const res = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
  if(!res.ok){
    let msg = res.statusText;
    try{ const j = await res.json(); msg = j.error || j.message || msg; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}

// ---------------- Init ----------------
async function init(){
  try{ state.config = await api('/api/config'); }catch(e){ toast('Gagal load config: '+e.message, true); }
  await loadSessions();
  if(state.sessions.length){
    await openSession(state.sessions[0].id);
  } else {
    await createNewSession();
  }
  wireGlobalUI();
}

async function loadSessions(){
  state.sessions = await api('/api/sessions');
  renderHistory();
}

function renderHistory(){
  const list = $('#historyList');
  list.innerHTML = '';
  state.sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = 'history-item' + (s.id === state.sessionId ? ' active' : '');
    item.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(s.title)}</span>
      <button class="del-hist" data-id="${s.id}">✕</button>`;
    item.addEventListener('click', (e)=>{ if(e.target.closest('.del-hist')) return; openSession(s.id); });
    item.querySelector('.del-hist').addEventListener('click', async (e)=>{
      e.stopPropagation();
      await api('/api/sessions/'+s.id, {method:'DELETE'});
      await loadSessions();
      if(s.id === state.sessionId){
        if(state.sessions.length) openSession(state.sessions[0].id); else createNewSession();
      }
    });
    list.appendChild(item);
  });
}

async function createNewSession(){
  const sess = await api('/api/sessions', {method:'POST'});
  await loadSessions();
  await openSession(sess.id);
}

async function openSession(id){
  const sess = await api('/api/sessions/'+id);
  state.sessionId = id;
  renderHistory();
  $('#headerTitle').textContent = sess.title;
  const landing = $('#landing'), messagesEl = $('#messages');
  messagesEl.innerHTML = '';
  const real = sess.messages.filter(m => !m.synthetic);
  if(real.length === 0){
    landing.hidden = false; messagesEl.hidden = true;
    $('#landingSlot').appendChild($('#inputBox') || buildInputBox());
  } else {
    landing.hidden = true; messagesEl.hidden = false;
    sess.messages.forEach(m => m.synthetic ? renderSyntheticToolMessage(m) : renderMessage(m));
    $('#bottomWrap').appendChild($('#inputBox') || buildInputBox());
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  $('#modelBtnLabel').textContent = sess.model || 'Pilih model';
  toggleSidebar(false);
}

function buildInputBox(){
  const tpl = $('#inputBoxTemplate');
  const frag = tpl.content.cloneNode(true);
  const box = frag.querySelector('#inputBox');
  document.body.appendChild(box); // temp, will be moved by caller via appendChild
  wireInputBox();
  return box;
}

// ---------------- Message rendering ----------------
function renderMessage(m){
  const messagesEl = $('#messages');
  const textContent = typeof m.content === 'string' ? m.content : (m.content.find(c=>c.type==='text')||{}).text || '';
  const displayText = m.role === 'assistant' ? stripToolBlocksForDisplay(textContent) : textContent;
  const hasImage = Array.isArray(m.content) && m.content.some(c=>c.type==='image_url');
  if(m.role === 'assistant' && !displayText.trim() && !hasImage){
    return null; // giliran ini cuma tool-call murni — sudah diwakili tool-card, gak perlu bubble kosong
  }

  const wrap = document.createElement('div');
  wrap.className = 'msg ' + m.role;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = marked.parse(displayText || '');
  bubble.dataset.raw = displayText;
  enhanceCodeBlocks(bubble);

  if(Array.isArray(m.content)){
    m.content.filter(c=>c.type==='image_url').forEach(c=>{
      const img = document.createElement('img');
      img.className = 'att-img'; img.src = c.image_url.url;
      bubble.appendChild(img);
    });
  }
  wrap.appendChild(bubble);

  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  actions.appendChild(makeActionBtn('copy', 'Salin', ()=> {
    navigator.clipboard.writeText(bubble.dataset.raw || '');
    toast('Disalin');
  }));
  if(m.role === 'assistant'){
    actions.appendChild(makeActionBtn('regen', 'Regenerasi', ()=> regenerate()));
  }
  wrap.appendChild(actions);

  messagesEl.appendChild(wrap);
  return wrap;
}

function makeActionBtn(kind, title, onClick){
  const icons = {
    copy: '<path d="M9 9h10v10H9z"/><path d="M5 15V5h10" fill="none"/>',
    regen: '<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>'
  };
  const b = document.createElement('button');
  b.title = title;
  b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[kind]}</svg>`;
  b.addEventListener('click', onClick);
  return b;
}

function enhanceCodeBlocks(bubble){
  $$('pre', bubble).forEach(pre => {
    const code = pre.querySelector('code');
    if(!code) return;
    hljs.highlightElement(code);
    const lang = (code.className.match(/language-(\w+)/)||[])[1] || 'text';
    const wrapDiv = document.createElement('div');
    wrapDiv.className = 'code-block';
    const head = document.createElement('div');
    head.className = 'code-head';
    head.innerHTML = `<span>${escapeHtml(lang)}</span><button>Copy</button>`;

    });

    wrapDiv.appendChild(head);
    wrapDiv.appendChild(pre);
  });
}

function renderToolCard(kind, summary, body, ok){

  card.innerHTML = `<div class="tool-card-head">
      <span class="tag ${tagClass}">${tagLabel}</span>
      <span class="summary">${escapeHtml(summary)}</span>
      <button class="toggle" aria-label="Buka/tutup detail" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <div class="tool-card-body" hidden>${escapeHtml(body || '(tidak ada output)')}</div>`;
  const head = card.querySelector('.tool-card-head');

// Parse pesan sintetis "[HASIL COMMAND]"/"[HASIL GITHUB]" (hasil tool dari server.py) jadi tool-card
// saat riwayat lama dibuka lagi — supaya riwayat konsisten dengan tampilan saat live streaming.
function renderSyntheticToolMessage(m){
  const raw = typeof m.content === 'string' ? m.content : '';
  if(raw.startsWith('[HASIL COMMAND]')){
    const mtch = raw.match(/^\[HASIL COMMAND\]\nexit_code: (-?\d+)\noutput:\n([\s\S]*)$/);
    const exit = mtch ? mtch[1] : '?';
    const output = mtch ? mtch[2] : raw;
    renderToolCard('shell', `Command — exit ${exit}`, output, exit === '0');
  } else if(raw.startsWith('[HASIL GITHUB]')){
    const output = raw.replace('[HASIL GITHUB]\n', '');
    renderToolCard('github', 'GitHub', output, !/^\[GITHUB ERROR/.test(output));
  }
}

async function sendMessage(regen=false){
  if(state.streaming){
    if(state.currentTurnId) await api('/api/turns/'+state.currentTurnId+'/stop', {method:'POST'});
    return;
  }
  const box = $('#inputBox');
  const textarea = box.querySelector('#chatTextarea');
  const text = textarea.value.trim();
  if(!regen && !text && state.attachments.length === 0) return;

  const landing = $('#landing'), messagesEl = $('#messages');
  if(landing.hidden === false){
    landing.hidden = true; messagesEl.hidden = false;
    $('#bottomWrap').appendChild(box);
  }

  if(!regen){
    const userMsg = { role:'user', content: text };
    if(state.attachments.some(a=>a.is_image)){
      userMsg.content = [{type:'text', text}, ...state.attachments.filter(a=>a.is_image).map(a=>({type:'image_url', image_url:{url:a.url}}))];
    }
    renderMessage(userMsg);
    textarea.value = '';
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;

  const attIds = state.attachments.map(a=>a.id);
  state.attachments = [];
  $('#attachPreview').innerHTML = '';

  setStreaming(true);
  let assistantBubbleWrap = null, assistantBubble = null, thinkingEl = null;
  let contentBuf = '';

  try{
    const res = await fetch(`/api/sessions/${state.sessionId}/send`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(regen ? {regenerate:true} : {text, attachments: attIds})
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for(const part of parts){
        if(!part.startsWith('data:')) continue;
        let ev;
        try{ ev = JSON.parse(part.slice(5).trim()); }catch(e){ continue; }
        handleEvent(ev);
      }
    }
  }catch(e){
    toast('Koneksi error: '+e.message, true);
  }
  setStreaming(false);
  await loadSessions();

  function handleEvent(ev){
    if(ev.type === 'turn_start'){ state.currentTurnId = ev.turn_id; }
    else if(ev.type === 'reasoning'){
      if(!thinkingEl) thinkingEl = logEntry('thinking', 'Sedang berpikir...', '');
      const body = thinkingEl.querySelector('.log-entry-body');
      body.textContent += ev.text;
    }
    else if(ev.type === 'content'){
      contentBuf += ev.text;
      // blok <<CMD>>/<<GH>> disaring dulu — jangan pernah tampil mentah di bubble (itu penyebab
      // balasan AI kelihatan aneh & bikin kotak melebar keluar)
      const displayText = stripToolBlocksForDisplay(contentBuf);
      const runKind = detectRunningToolKind(contentBuf);
      if(runKind) showRunningIndicator(runKind); else hideRunningIndicator();
      if(displayText){
        if(!assistantBubbleWrap){
          assistantBubbleWrap = renderMessage({role:'assistant', content: displayText});
          assistantBubble = assistantBubbleWrap.querySelector('.bubble');
        } else {
          assistantBubble.innerHTML = marked.parse(displayText);
          assistantBubble.dataset.raw = displayText;
          enhanceCodeBlocks(assistantBubble);
        }
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    else if(ev.type === 'tool_result'){
      hideRunningIndicator();
      const summary = ev.kind === 'github' ? `GitHub: ${ev.action} — ${ev.success?'ok':'gagal'}` : `Command — exit ${ev.exit_code}`;
      logEntry(ev.kind === 'github' ? 'github' : 'run', summary, ev.output || '');
      renderToolCard(ev.kind, summary, ev.output || '', ev.success);
      // giliran tool ini selesai; teks berikutnya (kalau ada) mulai bubble assistant baru
      assistantBubbleWrap = null; assistantBubble = null; contentBuf = '';
    }
    else if(ev.type === 'permission_request'){
      hideRunningIndicator();
      const summary = ev.kind === 'github_write'
        ? `Izin GitHub: ${ev.action} → ${ev.path||ev.new_branch||ev.branch||''}`
        : `Izin shell di luar sandbox: ${ev.cmd}`;
      logEntry('permission', summary, JSON.stringify(ev, null, 2), {permissionId: ev.permission_id});
      openLogDrawer();
    }
    else if(ev.type === 'error'){
      hideRunningIndicator();
      logEntry('error', ev.message, '');
      toast(ev.message, true);
    }
    else if(ev.type === 'info'){
      logEntry('info', ev.message, '');
    }
    else if(ev.type === 'stopped'){
      hideRunningIndicator();
      logEntry('info', 'Dihentikan oleh user', '');
    }
    else if(ev.type === 'done'){
      hideRunningIndicator();
      state.currentTurnId = null;
    }
  }
}

async function regenerate(){
  // hapus semua elemen ekor (bubble assistant + tool-card) sampai bubble user terakhir, sebelum minta ulang
  const messagesEl = $('#messages');
  while(messagesEl.lastElementChild && !messagesEl.lastElementChild.classList.contains('user')){
    messagesEl.lastElementChild.remove();
  }
  await sendMessage(true);
}

async function loadModels(force){
  const listEl = $('#modelList');
  const statusEl = $('#modelCacheStatus');
  listEl.innerHTML = 'Memuat...';
  statusEl.textContent = '';
  try{
    const data = await api('/api/models' + (force ? '?refresh=1' : ''));
    if(data.warning) toast(data.warning, true);
    state.models = data.models || [];
    if(data.cached_at){
      const when = new Date(data.cached_at*1000).toLocaleString('id-ID');
      statusEl.textContent = data.cached
        ? `✓ Model sudah diekstrak (${when}) — sudah tersimpan, klik "Ekstrak ulang" kalau mau refresh`
        : `✓ Baru selesai diekstrak dari router (${when})`;
      statusEl.className = 'field-status set';
    }
    renderModelList();
  }catch(e){ listEl.innerHTML = 'Gagal memuat model: '+escapeHtml(e.message); }
}
function renderModelList(){
  const listEl = $('#modelList');
  listEl.innerHTML = '';
  const currentModel = $('#modelBtnLabel').textContent;
  if(state.models.length === 0){
    listEl.innerHTML = '<p style="color:var(--text-muted);font-size:12.5px;">Belum ada model. Klik "Ekstrak ulang dari router" atau tambah manual di bawah.</p>';
    return;
  }
  state.models.forEach(m => {
    const row = document.createElement('div');
    row.className = 'tree-item' + (m.id === currentModel ? ' selected' : '');
    row.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(m.id)}</span>
      <span style="display:flex;gap:4px;align-items:center;flex-shrink:0;">
        ${m.vision ? '<span class="badge vision">vision</span>' : ''}
        ${m.custom ? '<span class="badge">manual</span>' : ''}
        ${m.custom ? '<button class="del-model" title="Hapus model manual" type="button" style="background:none;border:none;color:var(--text-muted);cursor:pointer;">✕</button>' : ''}
      </span>`;
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.del-model')) return;
      selectModel(m.id);
    });
    const delBtn = row.querySelector('.del-model');
    if(delBtn){
      delBtn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        await api('/api/models/custom/'+encodeURIComponent(m.id), {method:'DELETE'});
        toast('Model manual dihapus');
        await loadModels(false);
      });
    }
    listEl.appendChild(row);
  });
}

  await api('/api/sessions/'+state.sessionId, {method:'PATCH', body: JSON.stringify({model: id})});

// beda jalur dari aksi GitHub yang diminta AI lewat obrolan (yang wajib permission-gate).
async function ghApi(action, extra={}){
  const res = await fetch('/api/github_direct', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action, ...extra})});
  return res.json();
}

async function ghLoadTree(path){
  const data = await ghApi('list_tree', {path});
  const treeEl = $('#ghTree');
  const bc = $('#ghBreadcrumb');
  const parts = path.split('/').filter(Boolean);
  bc.innerHTML = `<span data-path="">root</span>` + parts.map((p,i)=>
    ` / <span data-path="${parts.slice(0,i+1).join('/')}">${escapeHtml(p)}</span>`).join('');
  $$('span', bc).forEach(s => s.addEventListener('click', ()=> ghLoadTree(s.dataset.path)));

  treeEl.innerHTML = '';
  if(data.error){ treeEl.innerHTML = `<p style="color:var(--danger);font-size:12px;">${escapeHtml(data.error)}</p>`; return; }
  (data.items||[]).forEach(item => {
    const el = document.createElement('div');
    el.className = 'tree-item';
    el.innerHTML = `<span>${item.type==='dir'?'📁':'📄'} ${escapeHtml(item.name)}</span>`;
    el.addEventListener('click', async ()=>{
      if(item.type === 'dir'){ ghLoadTree(item.path); }
      else {
        const r = await ghApi('read_file', {path: item.path});
        $('#ghFilePath').value = item.path;
        $('#ghFileContent').value = r.content || r.error || '';
      }
    });
    treeEl.appendChild(el);
  });
  state.ghCurrentPath = path;
}

async function ghLoadWorkflows(){
  const data = await ghApi('list_workflows', {});
  const sel = $('#ghWorkflowSelect');
  sel.innerHTML = '';
  (data.items||[]).forEach(w => {
    const opt = document.createElement('option');
    opt.value = w.path.split('/').pop();
    opt.textContent = w.name;
    sel.appendChild(opt);
  });
}

  $('#cfgRouterKey').placeholder = cfg.router_api_key_set ? '••••••• (kosongkan biar tetap dipakai)' : 'sk-...';
  $('#cfgRouterKeyStatus').textContent = cfg.router_api_key_set
    ? '✓ Sudah diset — tersimpan permanen, gak perlu diisi ulang'
    : 'Belum diset';
  $('#cfgRouterKeyStatus').className = 'field-status ' + (cfg.router_api_key_set ? 'set' : 'unset');
  $('#cfgGhToken').value = '';
  $('#cfgGhToken').placeholder = cfg.github_token_set ? '••••••• (kosongkan biar tetap dipakai)' : 'github_pat_...';
  $('#cfgGhTokenStatus').textContent = cfg.github_token_set
    ? '✓ Sudah diset — tersimpan permanen, gak perlu diisi ulang'
    : 'Belum diset';
  $('#cfgGhTokenStatus').className = 'field-status ' + (cfg.github_token_set ? 'set' : 'unset');
  $('#cfgGhRepo').value = cfg.github_repo || '';
  $('#cfgSandbox').value = cfg.sandbox_dir || '';
  openModal('modalSettings');
}
async function saveSettings(){
  const patch = {
    router_url: $('#cfgRouterUrl').value,
    github_repo: $('#cfgGhRepo').value,
    sandbox_dir: $('#cfgSandbox').value,
  };
  if($('#cfgRouterKey').value) patch.router_api_key = $('#cfgRouterKey').value;
  if($('#cfgGhToken').value) patch.github_token = $('#cfgGhToken').value;
  state.config = await api('/api/config', {method:'POST', body: JSON.stringify(patch)});
  closeModal('modalSettings');
  toast('Pengaturan disimpan');
}
async function addMemory(){
  const input = $('#memoryInput');
  if(!input.value.trim()) return;
  await api('/api/memory', {method:'POST', body: JSON.stringify({text: input.value.trim()})});
  input.value = '';
  renderMemoryList();
}

init();
</script>

</body>
</html>
